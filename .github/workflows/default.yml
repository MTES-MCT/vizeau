name: Default CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ci
    # Safety net: a hanging step must not keep a runner busy for hours
    timeout-minutes: 10
    env:
      APP_KEY: ${{ vars.APP_KEY }}
      DB_DATABASE: ${{ vars.DB_DATABASE }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_USER: ${{ vars.DB_USER }}
      HOST: ${{ vars.HOST }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      SESSION_DRIVER: ${{ vars.SESSION_DRIVER }}
      DRIVE_DISK: ${{ vars.DRIVE_DISK }}
      USER_UPLOADS_S3_ACCESS_KEY: ${{ secrets.USER_UPLOADS_S3_ACCESS_KEY }}
      USER_UPLOADS_S3_SECRET_KEY: ${{ secrets.USER_UPLOADS_S3_SECRET_KEY }}
      USER_UPLOADS_S3_REGION: ${{ vars.USER_UPLOADS_S3_REGION }}
      USER_UPLOADS_S3_BUCKET: ${{ vars.USER_UPLOADS_S3_BUCKET }}
      USER_UPLOADS_S3_ENDPOINT: ${{ vars.USER_UPLOADS_S3_ENDPOINT }}
      AAC_FILES_S3_ACCESS_KEY: ${{ secrets.AAC_FILES_S3_ACCESS_KEY }}
      AAC_FILES_S3_SECRET_KEY: ${{ secrets.AAC_FILES_S3_SECRET_KEY }}
      AAC_FILES_S3_REGION: ${{ vars.AAC_FILES_S3_REGION }}
      AAC_FILES_S3_BUCKET: ${{ vars.AAC_FILES_S3_BUCKET }}
      AAC_FILES_S3_ENDPOINT: ${{ vars.AAC_FILES_S3_ENDPOINT }}

    strategy:
      matrix:
        # Figé sur 24.18.x : Node 24.20 est passé au parseur d'URL ada 4, qui
        # fait échouer la validation des commandes ace via jsonschema 1.5.0
        # ("Invalid command exported from ... Invalid URL").
        # À dégeler à la prochaine upgrade de @adonisjs/core qui embarque le fix de @adonisjs/ace@14.1.1.
        node-version: [24.18.x]

    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: ${{ vars.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ vars.DB_DATABASE }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Verify package-lock.json is up to date
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json || {
            echo "❌ package-lock.json and package.json are out of sync!"
            echo "ℹ️ Run 'npm install' and commit the updated package-lock.json"
            exit 1
          }

  build:
    runs-on: ubuntu-latest
    environment: ci
    timeout-minutes: 10

    strategy:
      matrix:
        # Voir le commentaire du job "test"
        node-version: [24.18.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
